[

        urlEliminarBorrador: "{{ url_eliminar_borrador }}",
        urlNuevaVenta: "{{ url_nueva_venta }}",
        urlHistorial: "{{ url_historial }}",

<script>
    /* Pestañas horizontales del panel "Detalle de Venta" — cada
       botón/panel se busca dentro de la misma .vta-card para no
       interferir con otros grupos de pestañas que pueda haber en
       la página. */
    function vdtSwitchTab(id, btn) {
        const card = btn.closest('.vta-card');
        if (!card) return;
        card.querySelectorAll('.cdt-tab').forEach(t => t.classList.remove('cdt-tab--active'));
        card.querySelectorAll('.cdt-tab-panel').forEach(p => p.style.display = 'none');
        btn.classList.add('cdt-tab--active');
        const panel = card.querySelector('#vdtPanel' + id.charAt(0).toUpperCase() + id.slice(1));
        if (panel) panel.style.display = '';
    }
</script>

<script>

            telefono: "{{ datos_empresa.telefono|escapejs }}",
            email: "{{ datos_empresa.email|escapejs }}",
            cuit: "{{ datos_empresa.cuit|escapejs }}",
            condicion_iva: "{{ datos_empresa.get_condicion_iva_display|escapejs }}",
            ingresos_brutos: "{{ datos_empresa.ingresos_brutos|escapejs }}",
            fecha_inicio_actividades: "{% if datos_empresa.fecha_inicio_actividades %}{{ datos_empresa.fecha_inicio_actividades|date:'d/m/Y' }}{% endif %}",

        },

            numero: "{{ venta.numero|escapejs }}",
            fecha: "{{ venta.fecha|date:'d/m/Y'|escapejs }}",
            fecha_hora: "{% if venta.fecha_confirmacion %}{{ venta.fecha_confirmacion|date:'d/m/Y H:i' }}{% else %}{{ venta.fecha_alta|date:'d/m/Y H:i' }}{% endif %}",
            notas: "{{ venta.notas|escapejs }}",
            total: "{{ venta.total|stringformat:'.2f' }}",
            descuento_global_pct: "{{ venta.descuento_global_pct|stringformat:'.2f' }}",
            oferta_global_nombre: "{{ venta.oferta_global_nombre|escapejs }}",
            confirmado_por: "{% if venta.confirmado_por %}{{ venta.confirmado_por.get_full_name|default:venta.confirmado_por.username|escapejs }}{% else %}{% endif %}",
            medio_pago_display: "{{ venta.get_medio_pago_display|escapejs }}",
            condicion_venta_display: "{{ venta.condicion_venta_arca|escapejs }}",
        },
        cliente: {% if cliente_unico_venta %}{

            condicion_iva: "{{ cliente_unico_venta.get_cond_iva_display|escapejs }}",
            telefono: "{{ cliente_unico_venta.telefonos.first.numero|default:''|escapejs }}",
            direccion: "{{ cliente_unico_venta.get_direccion_completa|escapejs }}",
        }{% else %}null{% endif %},

            tipo_display: "{{ comprobante_arca.get_tipo_comprobante_display|escapejs }}",
            tipo_comprobante: {{ comprobante_arca.tipo_comprobante }},
            punto_venta: {{ comprobante_arca.punto_venta }},
            numero: {{ comprobante_arca.numero }},
            numero_display: "{{ comprobante_arca.punto_venta|stringformat:'05d' }}-{{ comprobante_arca.numero|stringformat:'08d' }}",
            cae: "{{ comprobante_arca.cae }}",
            cae_vencimiento: "{{ comprobante_arca.cae_vencimiento|date:'d/m/Y' }}",
            importe_total: "{{ comprobante_arca.importe_total|stringformat:'.2f' }}",
            importe_neto: "{{ comprobante_arca.importe_neto|stringformat:'.2f' }}",
            importe_iva: "{{ comprobante_arca.importe_iva|stringformat:'.2f' }}",
            receptor_documento: "{{ comprobante_arca.doc_receptor_display|escapejs }}",
            receptor_condicion_iva: "{{ comprobante_arca.condicion_iva_receptor_display|escapejs }}",
            qrDataUrl: "",
            qrPayload: {
                ver: 1,
                fecha: "{{ venta.fecha|date:'Y-m-d' }}",
                cuit: {{ datos_empresa.cuit|default:'0'|cut:'-' }},
                ptoVta: {{ comprobante_arca.punto_venta }},
                tipoCmp: {{ comprobante_arca.tipo_comprobante }},

                ctz: 1,
                tipoDocRec: {{ comprobante_arca.doc_tipo }},

                codAut: {{ comprobante_arca.cae }}

            {% for pago in pagos %}

        medio_display: "{{ pago.get_medio_display|escapejs }}",
        tarjeta_nombre: "{{ pago.tarjeta.nombre|default:''|escapejs }}",
        monto: "{{ pago.monto|stringformat:'.2f' }}",
        cantidad_pagos: {{ pago.cantidad_pagos }},
        etiqueta_plan: "{{ pago.etiqueta_plan|escapejs }}",
        recargo_pct: "{{ pago.recargo_pct|stringformat:'.2f' }}",
        recargo_monto: "{{ pago.recargo_monto|stringformat:'.2f' }}",
        redondeo_monto: "{{ pago.redondeo_monto|stringformat:'.2f' }}",
        excedente_label: "{{ pago.etiqueta_excedente|escapejs }}"
    } {% if not forloop.last %}, {% endif %}
    {% endfor %}
    ],
    items: [
        {% for item in items %}
    {
        nombre: "{{ item.nombre_ticket_display|escapejs }}",
            marca: "{% if item.producto %}{{ item.producto.marca|escapejs }}{% endif %}",
            codigo: "{{ item.producto_codigo|escapejs }}",
                unidad_medida: "{% if item.producto %}{{ item.producto.get_unidad_medida_display|escapejs }}{% endif %}",
                color: "{{ item.nombre_combinacion_display|escapejs }}",
                    cliente: "{% if item.nombre_cliente_display != '(sin cliente)' %}{{ item.nombre_cliente_display|escapejs }}{% endif %}",
                        cantidad: "{{ item.cantidad|floatformat:'-3' }}",
                            moneda: "{{ item.moneda|escapejs }}",
                                precio_unitario: "{{ item.precio_unitario|stringformat:'.2f' }}",
                                    descuento_pct: "{{ item.descuento_pct|stringformat:'.2f' }}",
                                        subtotal: "{{ item.subtotal|stringformat:'.2f' }}",
                                            condicion_pago_display: "{{ item.get_condicion_pago_display|escapejs }}",
        } {% if not forloop.last %}, {% endif %}

    ],
};
</script>
{% if comprobante_arca %}
<script>
    (function () {
        var payload = window.TICKET_DATA.comprobante_arca.qrPayload;
        var texto = 'https://www.arca.gob.ar/fe/qr/?p=' + btoa(JSON.stringify(payload));
        try {
            var qr = qrcode(0, 'M');  // 0 = detecta automáticamente el tamaño necesario
            qr.addData(texto);
            qr.make();
            window.TICKET_DATA.comprobante_arca.qrDataUrl = qr.createDataURL(6, 2);
        } catch (err) {
            console.error('No se pudo generar el QR del comprobante:', err);
        }
    })();
</script>
{% endif %}

<!-- Notas de Crédito emitidas (una por devolución que tenga una) — se
     imprimen como documento propio, ver ticket_nc.js. Misma forma de
     datos que comprobante_arca de arriba, más los ítems devueltos y el
     comprobante que corrige. -->
<script>
    window.NC_DATA = [
        {% for dev in devoluciones %}{% if dev.nota_credito_arca %}{
            devolucion_pk: {{ dev.pk }},
            comprobante_original_display: "{% if comprobante_arca %}{{ comprobante_arca.get_tipo_comprobante_display|escapejs }} {{ comprobante_arca.punto_venta|stringformat:'05d' }}-{{ comprobante_arca.numero|stringformat:'08d' }}{% endif %}",
            items: [
                {% for dev_item in dev.items.all %}{
                    nombre: "{{ dev_item.producto_nombre_snapshot|escapejs }}{% if dev_item.combinacion_desc_snapshot %} — {{ dev_item.combinacion_desc_snapshot|escapejs }}{% endif %}",
                    cantidad: "{{ dev_item.cantidad|stringformat:'.3f' }}",
                    precio_unitario: "{{ dev_item.precio_unitario|stringformat:'.2f' }}",
                    subtotal: "{{ dev_item.subtotal_devuelto|stringformat:'.2f' }}"
                }{% if not forloop.last %},{% endif %}{% endfor %}
            ],
            nc: {
                tipo_display: "{{ dev.nota_credito_arca.get_tipo_comprobante_display|escapejs }}",
                tipo_comprobante: {{ dev.nota_credito_arca.tipo_comprobante }},
                punto_venta: {{ dev.nota_credito_arca.punto_venta }},
                numero: {{ dev.nota_credito_arca.numero }},
                numero_display: "{{ dev.nota_credito_arca.numero_display }}",
                cae: "{{ dev.nota_credito_arca.cae }}",
                cae_vencimiento: "{{ dev.nota_credito_arca.cae_vencimiento|date:'d/m/Y' }}",
                importe_total: "{{ dev.nota_credito_arca.importe_total|stringformat:'.2f' }}",
                importe_neto: "{{ dev.nota_credito_arca.importe_neto|stringformat:'.2f' }}",
                importe_iva: "{{ dev.nota_credito_arca.importe_iva|stringformat:'.2f' }}",
                receptor_documento: "{{ dev.nota_credito_arca.doc_receptor_display|escapejs }}",
                receptor_condicion_iva: "{{ dev.nota_credito_arca.condicion_iva_receptor_display|escapejs }}",
                iva_grupos: [
                    {% if dev.nota_credito_arca.tipo_comprobante != 13 %}
                    {% for g in dev.calcular_iva_por_alicuota.grupos %}{
                        alicuota: "{{ g.alicuota }}",
                        neto: "{{ g.neto|stringformat:'.2f' }}",
                        iva: "{{ g.iva|stringformat:'.2f' }}"
                    }{% if not forloop.last %},{% endif %}{% endfor %}
                    {% endif %}
                ],
                qrDataUrl: "",
                qrPayload: {
                    ver: 1,
                    fecha: "{{ dev.fecha|date:'Y-m-d' }}",
                    cuit: {{ datos_empresa.cuit|default:'0'|cut:'-' }},
                    ptoVta: {{ dev.nota_credito_arca.punto_venta }},
                    tipoCmp: {{ dev.nota_credito_arca.tipo_comprobante }},
                    nroCmp: {{ dev.nota_credito_arca.numero }},
                    importe: {{ dev.nota_credito_arca.importe_total|stringformat:'.2f' }},
                    moneda: "PES",
                    ctz: 1,
                    tipoDocRec: {{ dev.nota_credito_arca.doc_tipo }},
                    nroDocRec: {{ dev.nota_credito_arca.doc_nro|default:'0' }},
                    tipoCodAut: "E",
                    codAut: {{ dev.nota_credito_arca.cae }}
                }
            }
        }{% if not forloop.last %},{% endif %}{% endif %}{% endfor %}
    ];

    (function () {
        window.NC_DATA.forEach(function (entrada) {
            var texto = 'https://www.arca.gob.ar/fe/qr/?p=' + btoa(JSON.stringify(entrada.nc.qrPayload));
            try {
                var qr = qrcode(0, 'M');
                qr.addData(texto);
                qr.make();
                entrada.nc.qrDataUrl = qr.createDataURL(6, 2);
            } catch (err) {
                console.error('No se pudo generar el QR de la Nota de Crédito:', err);
            }
        });
    })();
</script>
