<div class="kps-overlay" id="kaiPrintSelector" hidden>
    <section class="kps-dialog" role="dialog" aria-modal="true" aria-labelledby="kaiPrintSelectorTitulo" aria-describedby="kaiPrintSelectorDescripcion">
        <button type="button" class="kps-close" data-kps-cerrar aria-label="Cerrar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
        </button>
        <h2 class="kps-title" id="kaiPrintSelectorTitulo">Elegir formato de impresión</h2>
        <p class="kps-description" id="kaiPrintSelectorDescripcion">Seleccioná el tipo de papel o impresora que vas a usar.</p>

        <div class="kps-options">
            <button type="button" class="kps-option" data-kps-formato="a4">
                <span class="kps-option-icon">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 7H16M8 11H16M8 15H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="kps-option-copy"><strong>A4</strong><span>Láser, inkjet o guardar como PDF</span></span>
                <span class="kps-option-arrow">›</span>
            </button>
            <button type="button" class="kps-option" data-kps-formato="termica80">
                <span class="kps-option-icon">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="6" y="2" width="12" height="20" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M9 7H15M9 10H15M9 13H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="kps-option-copy"><strong>Térmica 80 mm</strong><span>Rollo estándar de impresora de caja</span></span>
                <span class="kps-option-arrow">›</span>
            </button>
            <button type="button" class="kps-option" data-kps-formato="termica58">
                <span class="kps-option-icon">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="8" y="2" width="8" height="20" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 7H14M10 10H14M10 13H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="kps-option-copy"><strong>Térmica 58 mm</strong><span>Rollo angosto para impresoras compactas</span></span>
                <span class="kps-option-arrow">›</span>
            </button>
        </div>
    </section>
</div>
