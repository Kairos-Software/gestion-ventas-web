<!-- Lienzo vivo + cursor a medida compartidos por login.html y las
     pantallas de recuperación de contraseña (ver login.css / login.js). -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="page-backdrop" id="pageBackdrop">
    <canvas class="page-shader" id="bgShader"></canvas>
    <div class="login-page-aura"></div>
    <div class="login-page-orbs" id="loginOrbs">
        <div class="login-page-orb login-page-orb--a"></div>
        <div class="login-page-orb login-page-orb--b"></div>
        <div class="login-page-orb login-page-orb--c"></div>
        <div class="login-page-orb login-page-orb--accent" id="orbAccent"></div>
    </div>
    <div class="login-page-particles" id="loginParticles"></div>
    <div class="login-page-grain"></div>
    <div class="login-page-spotlight" id="loginSpotlight"></div>
</div>
